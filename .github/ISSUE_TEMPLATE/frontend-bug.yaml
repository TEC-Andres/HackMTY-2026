name: Frontend Bug
description: Report a bug in the frontend.
title: "[FRONTEND] [BUG] "
labels: ["frontend", "bug"]
assignees: []
projects: ["TEC-Andres/2"]

body:
  - type: input
    id: issue-name
    attributes:
      label: Issue Name
      description: Enter the name of the bug.
      placeholder: "e.g., Fix navbar visual glitch on mobile"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Select the urgency level.
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: dropdown
    id: assignee
    attributes:
      label: Who will work on this?
      description: Choose the team member assigned to this issue.
      options:
        - "Ethiel Favila"
        - "Isabel Mejia Franco"
        - "Catherine"
        - "Andrés Rodríguez Cantú"
        - "Unassigned"
    validations:
      required: false

  - type: textarea
    id: issue-details
    attributes:
      label: Bug Details
      description: Provide steps to reproduce, expected vs actual behavior, and screenshots if applicable.
      placeholder: |
        Steps to reproduce:
        1. ...
        2. ...

        Expected: ...
        Actual: ...
    validations:
      required: true
