name: Frontend Issue
description: Create a new frontend issue with all required details.
title: "[FRONTEND] "
labels: ["frontend", "feature"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ### Frontend Issue Template
        Fill out the details below to properly document this frontend task.

  - type: dropdown
    id: feature-type
    attributes:
      label: Feature Type
      description: Select the category for this frontend task.
      options:
        - "New Feature"
        - "Bug Fix"
        - "UI/UX Polish"
        - "Performance Optimization"
        - "Refactoring"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Select the urgency level.
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: dropdown
    id: assignee
    attributes:
      label: Who will work on this?
      description: Choose the team member assigned to this issue.
      options:
        - "Ethiel Favila"
        - "Isabel Mejia Franco"
        - "Catherine"
        - "Andrés Rodríguez Cantú"
        - "Unassigned"
    validations:
      required: false

  - type: textarea
    id: issue-details
    attributes:
      label: Specify Details
      description: Provide detailed specifications, steps to reproduce, designs, or technical notes.
      placeholder: "Provide detailed specifications here..."
    validations:
      required: true
