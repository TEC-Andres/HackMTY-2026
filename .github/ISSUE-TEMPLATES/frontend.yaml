name: Frontend Issue Report
description: Create a new issue specifically for the frontend repository/project.
title: "[FRONTEND]: "
labels: ["frontend", "feature"]
projects: ["TEC-Andres/2"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ### Thanks for filing a frontend issue!
        Please fill out the details below to help us address this issue or feature request effectively.

  - type: input
    id: issue-name
    attributes:
      label: Issue Name / Title
      description: Enter the name of the issue.
      placeholder: "e.g., Fix navbar visual glitch on mobile"
    validations:
      required: true

  - type: dropdown
    id: feature-type
    attributes:
      label: Feature Type
      description: Select the category for this frontend task.
      options:
        - "New Feature"
        - "Bug Fix"
        - "UI/UX Polish"
        - "Performance Optimization"
        - "Refactoring"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Select the urgency level.
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: dropdown
    id: assignee
    attributes:
      label: Assignee / Who will work on this?
      description: Choose the team member assigned to work on this issue.
      options:
        - "Andrés (TEC-Andres)"
        - "Frontend Dev 1"
        - "Frontend Dev 2"
        - "UI/UX Designer"
        - "Unassigned"
    validations:
      required: false

  - type: textarea
    id: issue-details
    attributes:
      label: Detailed Specifications
      description: Provide long-form details, steps to reproduce, designs, or technical notes.
      placeholder: "Provide detailed specifications or steps here..."
    validations:
      required: true